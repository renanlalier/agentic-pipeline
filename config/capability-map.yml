version: 2
owner: renanlalier

# Isto e uma lista de GOVERNANCA - quais repos a pipe tem permissao de
# tocar, e quem e dono de cada um. NAO e mais um dicionario de
# palavras-chave: a decisao de quais repos uma demanda afeta e feita
# pelo agente Tech Lead, lendo a descricao e o README REAIS de cada
# repo (buscados via API do GitHub em runtime), com julgamento
# semantico - nao por match literal de string.
#
# `summary` aqui e um resumo de dominio dado pela platform, para o
# agente cruzar com o que ele encontrar ao vivo no GitHub. Nao e usado
# para grep.

repos:
  - name: app-poc-1
    role: frontend-engineer
    owner_team: time-frontend
    summary: "Interface do usuario - telas, componentes, navegacao, formularios."
  - name: app-poc-2
    role: backend-engineer
    owner_team: time-backend
    summary: "API e regras de negocio - rotas, contratos, autenticacao, persistencia."

# Regras de propagacao: se um repo entra no escopo, outro provavelmente entra junto.
implies:
  - when: app-poc-2
    likely: [app-poc-1]
    reason: "mudanca de contrato quase sempre exige acompanhamento na UI"
    requires: expand-contract

# Repos que nunca entram no escopo automatico, mesmo que a demanda os
# mencione.
excluded:
  - name: poc-agentic-platform
    reason: "a pipe nao se modifica a si mesma dentro de uma demanda"
  - name: poc-agentic-intake
    reason: "e o registro de trabalho, nao um alvo de implementacao"
