version: 1

# O agente Tech Lead consulta este mapa para PROPOR quais repos a demanda
# atinge. A proposta vai para aprovacao humana (HITL 1) antes de virar
# sub-issue. Quando o agente erra o escopo, corrige-se ESTE arquivo - nao
# o prompt.
#
# O campo `role` referencia um papel GENERALISTA (agents/<role>/system.md).
# A capacidade de stack de cada repo vem das skills carregadas em runtime,
# nao do nome do papel - por isso app-poc-1 (React) e app-poc-2 (Kotlin)
# usam papeis diferentes em stack mas o mesmo papel logico por funcao.

owner: renanlalier

domains:
  - name: interface-usuario
    description: "telas, componentes, navegacao e estados da UI (React)"
    repos:
      - name: app-poc-1
        role: frontend-engineer
        owner_team: time-frontend
        stack: react
        typical_changes: [componente, tela, navegacao, validacao de formulario]
    keywords:
      - tela
      - botao
      - formulario
      - login
      - navegacao
      - componente
      - interface
      - usuario ve
      - mensagem de erro

  - name: contratos-e-dados
    description: "API, contratos e regras de negocio (Kotlin/Ktor)"
    repos:
      - name: app-poc-2
        role: backend-engineer
        owner_team: time-backend
        stack: kotlin-ktor
        typical_changes: [rota, endpoint, validacao, contrato de resposta]
    keywords:
      - api
      - endpoint
      - contrato
      - schema
      - banco
      - autenticacao
      - token
      - sessao
      - validacao no servidor

# Regras de propagacao: se um repo entra no escopo, outro provavelmente entra junto.
implies:
  - when: app-poc-2
    likely: [app-poc-1]
    reason: "mudanca de contrato quase sempre exige acompanhamento na UI"
    requires: expand-contract

# Repos que nunca entram no escopo automatico.
excluded:
  - name: poc-agentic-platform
    reason: "a pipe nao se modifica a si mesma dentro de uma demanda"
  - name: poc-agentic-intake
    reason: "e o registro de trabalho, nao um alvo de implementacao"
