version: 2
owner: renanlalier

# This is a GOVERNANCE list — which repos the pipeline has permission to
# touch, and who owns each one. It is NOT a keyword dictionary:
# the decision of which repos a demand affects is made by the Tech Lead
# agent, reading the real description and README of each repo (fetched via
# the GitHub API at runtime), with semantic judgment — not literal string
# matching.
#
# `summary` here is a domain summary provided by the platform, for the
# agent to cross-reference with what it finds live on GitHub. Not used
# for grep.

repos:
  - name: app-poc-1
    role: frontend-engineer
    owner_team: frontend-team
    summary: "User interface — screens, components, navigation, forms."
  - name: app-poc-2
    role: backend-engineer
    owner_team: backend-team
    summary: "API and business rules — routes, contracts, authentication, persistence."

# Propagation rules: if one repo enters scope, another likely comes along.
implies:
  - when: app-poc-2
    likely: [app-poc-1]
    reason: "a contract change almost always requires a corresponding UI update"
    requires: expand-contract

# Repos that never enter automatic scope, even if the demand names them.
excluded:
  - name: poc-agentic-platform
    reason: "the pipeline does not modify itself within a demand"
  - name: poc-agentic-intake
    reason: "it is the work record, not an implementation target"
