version: 1

# Level 1 configuration. Edited by Platform Engineering + Security.
# The .agentic/config.yml of each repo can only choose FROM this list.
#
# Roles below are intentionally generic — frontend-engineer and
# backend-engineer do not embed a framework name. Stack capability
# (React, Kotlin/Ktor, whatever comes next) lives in each role's
# skills, not in the role name. See brain/skills/.

providers:
  anthropic:
    approved: true
    data_policy: no-training
  openai:
    approved: true
    data_policy: no-training

clis:
  dry-run:
    approved: true
    adapter: actions/run-agent/adapters/dry-run.sh
    notes: "POC adapter — does not call any model, simulates role output"
  cursor:
    approved: true
    adapter: actions/run-agent/adapters/cursor.sh
  codex:
    approved: true
    adapter: actions/run-agent/adapters/codex.sh
  claude-code:
    approved: true
    adapter: actions/run-agent/adapters/claude-code.sh

models:
  po:                  [dry-run, claude-sonnet-4-6, gpt-5-mini]
  tech-lead:            [dry-run, claude-opus-5, claude-sonnet-4-6]
  frontend-engineer:    [dry-run, claude-sonnet-4-6, gpt-5]
  backend-engineer:     [dry-run, claude-sonnet-4-6, gpt-5]
  qa:                   [dry-run, claude-sonnet-4-6]

budgets:
  default_usd_per_demand: 5
  hard_stop_usd_per_demand: 10
  max_retries_per_role: 2

gateway:
  enabled: false
  required_headers:
    - execution-id
    - run-id
    - role
    - cli
    - model
    - repo
