version: 1

# Nivel 1 da configuracao. Editado por Platform Engineering + Security.
# O .agentic/config.yml de cada repo so pode escolher DENTRO desta lista.

providers:
  anthropic:
    approved: true
    data_policy: no-training
  openai:
    approved: true
    data_policy: no-training

clis:
  cursor:
    approved: true
    adapter: adapters/cursor.sh
  codex:
    approved: true
    adapter: adapters/codex.sh
  claude-code:
    approved: true
    adapter: adapters/claude-code.sh
  dry-run:
    approved: true
    adapter: adapters/dry-run.sh
    notes: "adapter de POC - nao chama modelo, simula a saida do papel"

models:
  po:            [dry-run, claude-sonnet-4-6, gpt-5-mini]
  lead-swe:      [dry-run, claude-opus-5, claude-sonnet-4-6]
  frontend-swe:  [dry-run, claude-sonnet-4-6, gpt-5]
  backend-swe:   [dry-run, claude-sonnet-4-6, gpt-5]
  qa:            [dry-run, claude-sonnet-4-6]

budgets:
  default_usd_per_demand: 5
  hard_stop_usd_per_demand: 10
  max_retries_per_role: 2

gateway:
  # na POC nao ha gateway real; os headers sao apenas emitidos no log
  enabled: false
  required_headers:
    - execution-id
    - run-id
    - role
    - cli
    - model
    - repo
