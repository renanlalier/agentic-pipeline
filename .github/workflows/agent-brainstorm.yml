name: agent-brainstorm (reusable)

# Runs in the INTAKE repo, two or more times per demand: when the issue
# opens, and again for each human comment while the dialogue is still open.
# Uses the PO role + brainstorming skill (adapted from obra/superpowers).
#
# status "ask"      -> posts the question, keeps status-brainstorming
# status "approved" -> fills the ## Scope section in the issue body,
#                      changes to status-scope-defined (the caller's
#                      on-issue.yml listens for this label to trigger
#                      agent-lead, which proposes affected repos)
# status "escalated" -> posts the reason and stops (round count exceeded
#                       or human asked to cancel)
#
# IMPORTANT: because authentication uses a personal PAT (not a GitHub App
# bot), every comment posted by the pipeline appears under the SAME user
# who opened the issue — there is no way to distinguish by login. For this
# reason every comment this workflow posts carries the invisible HTML marker
# <!-- pipe:brainstorm --> at the end, and the caller (on-issue.yml) uses
# that marker to NOT re-trigger brainstorm when the pipeline's own comment
# arrives via issue_comment.created. Without this, the pipeline would loop
# replying to itself.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      PIPE_TOKEN:
        required: true

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Checkout platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/agentic-pipeline
          ref: v1
          path: .platform

      - name: Build conversation (issue + comments so far)
        id: context
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$ISSUE" > issue.json
          TITLE=$(jq -r '.title' issue.json)
          BODY=$(jq -r '.body // ""' issue.json)

          gh api "repos/$REPO/issues/$ISSUE/comments" > comments.json
          N=$(jq 'length' comments.json)

          {
            echo "prompt<<PROMPTEOF"
            echo "## Original demand"
            echo "$TITLE"
            echo ""
            echo "$BODY"
            echo ""
            if [ "$N" -gt 0 ]; then
              echo "## Conversation so far ($N comment(s), in order)"
              echo "Comments marked with [PIPE] are your own previous turns;"
              echo "the others are from the human."
              jq -r '.[] | (if (.body | contains("<!-- pipe:brainstorm -->")) then "**[PIPE]**" else "**[HUMAN] \(.user.login)**" end) + "\n" + .body + "\n"' comments.json
            else
              echo "## Conversation so far"
              echo "(no comments yet — this is the first turn)"
            fi
            echo ""
            echo "## Instruction"
            echo "Apply the brainstorming skill. If clarity is still missing, ask"
            echo "ONE question. If the last HUMAN comment approved a scope that"
            echo "you yourself presented in a prior [PIPE] turn, conclude with"
            echo "status approved and fill the scope field."
            echo "PROMPTEOF"
          } >> "$GITHUB_OUTPUT"

          echo "comment rounds so far: $N"

      - name: Execute PO role
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: po
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ inputs.execution_id }}
          prompt: ${{ steps.context.outputs.prompt }}
          platform_path: .platform

      - name: Act on PO decision
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat <<'RESULTEOF' > agent_result.json
          ${{ steps.agent.outputs.result }}
          RESULTEOF

          echo "--- PO output ---"
          cat agent_result.json

          if ! jq empty agent_result.json 2>/dev/null; then
            echo "::error::PO agent output is not valid JSON."
            exit 1
          fi

          STATUS=$(jq -r '.status' agent_result.json)

          case "$STATUS" in
            ask)
              QUESTION=$(jq -r '.question' agent_result.json)
              {
                echo "$QUESTION"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: brainstorming_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=status-brainstorming" >/dev/null
              ;;

            approved)
              SCOPE=$(jq -r '.scope' agent_result.json)

              # replace the "## Scope" placeholder in the body with the filled version
              # reuses issue.json already saved in the previous step
              CURRENT_BODY=$(jq -r '.body // ""' issue.json)
              NEW_BODY=$(awk -v scope="$SCOPE" '
                BEGIN{done=0}
                /^## Scope/{
                  print; print "";
                  print scope;
                  skip=1; done=1; next
                }
                skip && /^## /{ skip=0 }
                skip{ next }
                { print }
              ' <<< "$CURRENT_BODY")

              jq -n --arg body "$NEW_BODY" '{body: $body}' > body_payload.json
              gh api -X PATCH "repos/$REPO/issues/$ISSUE" --input body_payload.json

              {
                echo "**Scope defined from the conversation.** Forwarding for proposal of affected repositories."
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: brainstorming concluded_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=status-scope-defined" >/dev/null
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/status-brainstorming" >/dev/null 2>&1 || true
              ;;

            escalated)
              NOTES=$(jq -r '.notes' agent_result.json)
              {
                echo "## PO escalated this demand"
                echo ""
                echo "$NOTES"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL)_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json
              exit 1
              ;;

            *)
              echo "::error::Unknown status returned by PO: $STATUS"
              exit 1
              ;;
          esac
