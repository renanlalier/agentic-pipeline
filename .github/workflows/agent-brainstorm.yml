name: agent-brainstorm (reusable)

# Runs in the INTAKE repo, two or more times per demand: when the issue
# opens, and again for each human comment while the dialogue is still open.
# Uses the PO role + brainstorming skill (adapted from obra/superpowers).
#
# status "ask"      -> posts the question, keeps brainstorming
# status "approved" -> fills the ### Scope section in the issue body,
#                      changes to scope-defined (the caller's
#                      on-issue.yml listens for this label to trigger
#                      agent-lead, which proposes affected repos)
# status "escalated" -> posts the reason and stops (round count exceeded
#                       or human asked to cancel)
#
# IMPORTANT: every comment posted by the pipeline carries the invisible HTML
# marker <!-- pipe:brainstorm --> at the end. The caller (on-brainstorm.yml)
# uses that marker to NOT re-trigger brainstorm when the pipeline's own
# comment arrives via issue_comment.created. Without this the pipeline would
# loop replying to itself.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
      execution_target:
        required: false
        type: string
        default: ""
      github_token:
        required: false
        type: string
        default: ""
      secrets_source:
        description: "Override secrets.source from .agentic/config.yml. 'github-secrets' | 'vault'"
        required: false
        type: string
        default: ""
      requester:
        description: "GitHub username of the demand author. Used to look up per-user credentials in the vault."
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: true
        description: "GitHub App ID for generating a scoped installation token"
      APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key (PEM) for generating a scoped installation token"
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      CURSOR_API_KEY:
        required: false
      CONTEXT7_API_KEY:
        required: false

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      AZURE_VAULT_URL: ${{ vars.AZURE_VAULT_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/agentic-pipeline
          ref: v1
          path: .platform

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve secrets_source (level 3 → 2)
        id: secrets_src
        run: |
          set -euo pipefail
          SRC="${{ inputs.secrets_source }}"
          [ -z "$SRC" ] && SRC=$(yq -r '.secrets.source // ""' .agentic/config.yml 2>/dev/null || echo "")
          [ -z "$SRC" ] && SRC="github-secrets"
          echo "secrets_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "Secrets source resolved to: $SRC"

      - name: Azure login (vault source)
        if: steps.secrets_src.outputs.secrets_source == 'vault'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build conversation (issue + last 5 comments)
        id: context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$ISSUE" > issue.json
          TITLE=$(jq -r '.title' issue.json)
          BODY=$(jq -r '.body // ""' issue.json)

          gh api "repos/$REPO/issues/$ISSUE/comments" > all_comments.json
          TOTAL=$(jq 'length' all_comments.json)
          jq '.[-5:]' all_comments.json > comments.json
          N=$(jq 'length' comments.json)

          {
            echo "prompt<<PROMPTEOF"
            echo "## Original demand"
            echo "$TITLE"
            echo ""
            echo "$BODY"
            echo ""
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Conversation so far (last $N of $TOTAL comment(s), in order)"
              echo "Comments marked with [PIPE] are your own previous turns;"
              echo "the others are from the human."
              jq -r '.[] | (if (.body | contains("<!-- pipe:brainstorm -->")) then "**[PIPE]**" else "**[HUMAN] \(.user.login)**" end) + "\n" + .body + "\n"' comments.json
            else
              echo "## Conversation so far"
              echo "(no comments yet — this is the first turn)"
            fi
            echo ""
            echo "## Instruction"
            echo "Apply the brainstorming skill. Identify ALL open questions"
            echo "upfront and ask them in a single, well-structured message —"
            echo "never split questions across turns. If the last HUMAN comment"
            echo "approved a scope that you yourself presented in a prior [PIPE]"
            echo "turn, conclude with status approved and fill the scope field."
            echo "PROMPTEOF"
          } >> "$GITHUB_OUTPUT"

          echo "comment rounds so far: $TOTAL (sending last $N)"

      - name: Execute PO role
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: po
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ inputs.execution_id }}
          prompt: ${{ steps.context.outputs.prompt }}
          platform_path: .platform
          execution_target: ${{ inputs.execution_target }}
          issue_number: ${{ inputs.issue_number }}
          repo_full_name: ${{ github.repository }}
          github_token: ${{ inputs.github_token != '' && inputs.github_token || steps.app-token.outputs.token }}
          secrets_source: ${{ steps.secrets_src.outputs.secrets_source }}
          requester: ${{ inputs.requester }}

      - name: Act on PO decision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_BODY: ${{ steps.agent.outputs.body }}
          STATUS: ${{ steps.agent.outputs.status }}
        run: |
          set -euo pipefail

          echo "--- PO output (status: $STATUS) ---"
          printf '%s\n' "$AGENT_BODY"

          case "$STATUS" in
            dispatched_to_cloud)
              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=brainstorming" >/dev/null
              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=awaiting-agent-response" >/dev/null
              echo "Dispatched to Codex Cloud — waiting for bot response on issue #$ISSUE."
              ;;

            ask)
              {
                printf '%s\n' "$AGENT_BODY"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: brainstorming_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=brainstorming" >/dev/null
              ;;

            approved)
              # Extract scope from <!-- scope-begin --> / <!-- scope-end --> delimiters.
              SCOPE=$(printf '%s\n' "$AGENT_BODY" | sed -n '/<!-- scope-begin -->/,/<!-- scope-end -->/{ /<!-- scope-begin -->/d; /<!-- scope-end -->/d; p }')

              # Replace ### Scope section idempotently.
              CURRENT_BODY=$(jq -r '.body // ""' issue.json)
              BASE_BODY=$(printf '%s' "$CURRENT_BODY" | sed '/^### Scope$/,$d' | sed 's/[[:space:]]*$//')
              NEW_BODY="$(printf '%s\n\n### Scope\n\n%s' "$BASE_BODY" "$SCOPE")"

              jq -n --arg body "$NEW_BODY" '{body: $body}' > body_payload.json
              gh api -X PATCH "repos/$REPO/issues/$ISSUE" --input body_payload.json

              {
                echo "**Scope defined from the conversation.** Forwarding for proposal of affected repositories."
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: brainstorming concluded_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$ISSUE/labels" \
                -f "labels[]=scope-defined" >/dev/null
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/brainstorming" >/dev/null 2>&1 || true
              ;;

            escalated)
              {
                printf '%s\n' "$AGENT_BODY"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL)_"
                echo "<!-- pipe:brainstorm -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json
              exit 1
              ;;

            *)
              echo "::error::Unknown status returned by PO: $STATUS"
              exit 1
              ;;
          esac
