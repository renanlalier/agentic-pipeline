name: agent-lead (reusable)

# Passo 2-3 do fluxo. Roda no repo de INTAKE.
# Le a issue, cruza com o capability-map e PROPOE o escopo de repositorios.
# Nao cria sub-issue: isso so acontece depois da aprovacao humana (HITL 1).
#
# NOTA DE SEGURANCA: o texto da issue nunca e interpolado com ${{ }} dentro
# de um bloco run. Ele trafega por arquivo e por env. Interpolar conteudo
# controlado pelo usuario em shell e injecao de comando.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      PIPE_TOKEN:
        required: true

jobs:
  propor-escopo:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout do repo consumidor
        uses: actions/checkout@v5

      - name: Checkout da platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/poc-agentic-platform
          ref: v1
          path: .platform

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Ler a issue
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$REPO" --json title,body > issue.json
          jq -r '.title + "\n" + (.body // "")' issue.json > issue.txt
          echo "--- conteudo lido da issue ---"
          cat issue.txt

      - name: Casar demanda com o capability map
        id: escopo
        run: |
          set -euo pipefail
          MAP=.platform/config/capability-map.yml

          # normaliza: minusculas e sem acento, para o match de keyword
          tr '[:upper:]' '[:lower:]' < issue.txt \
            | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null > norm.txt || \
            tr '[:upper:]' '[:lower:]' < issue.txt > norm.txt

          : > matched.txt

          N=$(yq -r '.domains | length' "$MAP")
          echo "dominios no mapa: $N"

          for i in $(seq 0 $((N-1))); do
            DOMAIN=$(yq -r ".domains[$i].name" "$MAP")
            REPO_NAME=$(yq -r ".domains[$i].repos[0].name" "$MAP")
            ROLE=$(yq -r ".domains[$i].repos[0].role" "$MAP")
            KW_COUNT=$(yq -r ".domains[$i].keywords | length" "$MAP")

            for k in $(seq 0 $((KW_COUNT-1))); do
              KW=$(yq -r ".domains[$i].keywords[$k]" "$MAP")
              if grep -qiF -- "$KW" norm.txt; then
                echo "$REPO_NAME|$ROLE|casou com a palavra \"$KW\" (dominio $DOMAIN)" >> matched.txt
                echo "  match: $DOMAIN <- '$KW'"
                break
              fi
            done
          done

          # regras de propagacao
          IN=$(yq -r '.implies | length' "$MAP")
          for i in $(seq 0 $((IN-1))); do
            WHEN=$(yq -r ".implies[$i].when" "$MAP")
            if cut -d'|' -f1 matched.txt | grep -qx "$WHEN"; then
              LIKELY=$(yq -r ".implies[$i].likely[0]" "$MAP")
              if ! cut -d'|' -f1 matched.txt | grep -qx "$LIKELY"; then
                ROLE=$(yq -r ".domains[] | select(.repos[0].name == \"$LIKELY\") | .repos[0].role" "$MAP")
                REASON=$(yq -r ".implies[$i].reason" "$MAP")
                echo "$LIKELY|$ROLE|propagacao a partir de \`$WHEN\`: $REASON" >> matched.txt
                echo "  propagacao: $WHEN -> $LIKELY"
              fi
            fi
          done

          if [ ! -s matched.txt ]; then
            echo "::error::Nenhum dominio do capability map casou com a demanda. Stop condition - o Lead escala em vez de adivinhar."
            exit 1
          fi

          echo "--- escopo proposto ---"
          cat matched.txt

      - name: Executar o papel lead-swe
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: lead-swe
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ inputs.execution_id }}
          prompt: "Propor escopo tecnico para a demanda registrada na issue."
          platform_path: .platform

      - name: Publicar proposta de escopo na issue
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Escopo proposto pela pipe"
            echo ""
            echo "\`execution_id\`: \`$EXEC_ID\`"
            echo "\`cli\`: \`$CLI\` · \`model\`: \`$MODEL\`"
            echo "[run desta etapa]($RUN_URL)"
            echo ""
            echo "| repositorio | papel | por que entrou |"
            echo "|---|---|---|"
            while IFS='|' read -r R RO WHY; do
              [ -z "$R" ] && continue
              echo "| \`$R\` | \`$RO\` | $WHY |"
            done < matched.txt
            echo ""
            echo "---"
            echo "**HITL 1 — aprovacao de escopo.**"
            echo "Aplique a label \`escopo-aprovado\` para a pipe criar as sub-issues"
            echo "e disparar a implementacao. Corrija a lista acima antes, se necessario."
          } > comment.md

          cat comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file comment.md
          gh issue edit "$ISSUE" --repo "$REPO" \
            --add-label "estado/aguardando-escopo" \
            --remove-label "estado/novo" || true
