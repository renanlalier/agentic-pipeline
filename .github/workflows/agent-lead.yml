name: agent-lead (reusable)

# Passo 2-3 do fluxo. Roda no repo de INTAKE.
# Le a issue, busca o fingerprint REAL de cada repo elegivel (descricao
# do GitHub + trecho de README) e delega ao agente Tech Lead a decisao
# de escopo por julgamento semantico - nao por match de keyword.
# Nao cria sub-issue: isso so acontece depois da aprovacao humana (HITL 1).
#
# NOTA: usamos `gh api` (REST) em vez de `gh issue comment`/`gh issue edit`.
# Tokens fine-grained tem suporte incompleto a mutations GraphQL.
#
# NOTA DE SEGURANCA: o texto da issue nunca e interpolado com ${{ }} dentro
# de um bloco run. Ele trafega por arquivo e por env.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      PIPE_TOKEN:
        required: true

jobs:
  propor-escopo:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout do repo consumidor
        uses: actions/checkout@v5

      - name: Checkout da platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/poc-agentic-platform
          ref: v1
          path: .platform

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Ler a issue
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$ISSUE" > issue.json
          jq -r '.title + "\n" + (.body // "")' issue.json > issue.txt
          echo "--- conteudo lido da issue ---"
          cat issue.txt

      - name: Buscar fingerprint real dos repos elegiveis e montar o prompt
        id: contexto
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          MAP=.platform/config/capability-map.yml

          N=$(yq -r '.repos | length' "$MAP")
          echo "repos elegiveis no capability map: $N"

          : > fingerprints.md
          for i in $(seq 0 $((N-1))); do
            REPO_NAME=$(yq -r ".repos[$i].name" "$MAP")
            ROLE=$(yq -r ".repos[$i].role" "$MAP")
            SUMMARY=$(yq -r ".repos[$i].summary" "$MAP")

            LIVE=$(gh api "repos/$OWNER/$REPO_NAME" --jq '{description: .description, language: .language}' 2>/dev/null || echo '{}')
            DESC=$(echo "$LIVE" | jq -r '.description // "sem descricao no GitHub"')
            LANG=$(echo "$LIVE" | jq -r '.language // "desconhecida"')

            README=$(gh api "repos/$OWNER/$REPO_NAME/readme" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null | head -c 500 || echo "(sem README)")

            {
              echo "### $REPO_NAME"
              echo "papel logico sugerido: $ROLE"
              echo "resumo de dominio (capability map): $SUMMARY"
              echo "descricao no GitHub: $DESC"
              echo "linguagem principal: $LANG"
              echo "trecho do README:"
              echo '```'
              echo "$README"
              echo '```'
              echo ""
            } >> fingerprints.md

            echo "fingerprint obtido: $REPO_NAME ($LANG)"
          done

          {
            echo "prompt<<PROMPTEOF"
            echo "Analise a demanda abaixo e proponha quais dos repositorios"
            echo "elegiveis listados sao afetados, com justificativa especifica"
            echo "baseada no que voce le na descricao e no README de cada um -"
            echo "nao em uma lista fixa de palavras-chave."
            echo ""
            echo "## Demanda"
            cat issue.txt
            echo ""
            echo "## Repositorios elegiveis (fingerprint obtido ao vivo do GitHub)"
            cat fingerprints.md
            echo "PROMPTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Executar o papel tech-lead
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: tech-lead
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ inputs.execution_id }}
          prompt: ${{ steps.contexto.outputs.prompt }}
          platform_path: .platform

      - name: Interpretar a decisao do agente
        id: decisao
        run: |
          set -euo pipefail
          cat <<'RESULTEOF' > agent_result.json
          ${{ steps.agent.outputs.result }}
          RESULTEOF

          echo "--- saida do agente ---"
          cat agent_result.json

          if ! jq empty agent_result.json 2>/dev/null; then
            echo "::error::A saida do agente nao e JSON valido. Veja o log acima."
            exit 1
          fi

          STATUS=$(jq -r '.status' agent_result.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "escalated" ]; then
            echo "::warning::Tech Lead escalou em vez de propor escopo. Isso e o stop_condition do system.md agindo - nao um bug."
          fi

          N_REPOS=$(jq -r '.repos | length' agent_result.json)
          if [ "$STATUS" != "escalated" ] && [ "$N_REPOS" -eq 0 ]; then
            echo "::error::Agente retornou status ok mas nenhum repositorio proposto. Tratando como escalada."
            echo "status=escalated" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar proposta de escopo na issue
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          STATUS: ${{ steps.decisao.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$STATUS" = "escalated" ]; then
            SUMMARY=$(jq -r '.summary' agent_result.json)
            NOTES=$(jq -r '.notes' agent_result.json)
            {
              echo "## Tech Lead escalou esta demanda"
              echo ""
              echo "\`execution_id\`: \`$EXEC_ID\` · [run desta etapa]($RUN_URL)"
              echo ""
              echo "**Resumo:** $SUMMARY"
              echo ""
              echo "**Motivo:** $NOTES"
              echo ""
              echo "---"
              echo "Nenhuma stop condition automatica falhou aqui - o agente"
              echo "avaliou os repositorios elegiveis e não encontrou correspondência"
              echo "segura com julgamento suficiente. Refine a demanda e reabra,"
              echo "ou ajuste \`config/capability-map.yml\` se um repositorio"
              echo "relevante estiver faltando na lista de elegiveis."
            } > comment.md
            jq -Rs '{body: .}' comment.md > payload.json
            gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json
            exit 1
          fi

          {
            echo "## Escopo proposto pela pipe"
            echo ""
            echo "\`execution_id\`: \`$EXEC_ID\`"
            echo "\`cli\`: \`$CLI\` · \`model\`: \`$MODEL\`"
            echo "[run desta etapa]($RUN_URL)"
            echo ""
            echo "| repositorio | papel | por que entrou |"
            echo "|---|---|---|"
            jq -r '.repos[] | "| `\(.name)` | `\(.role)` | \(.reason) |"' agent_result.json
            echo ""
            echo "---"
            echo "**HITL 1 — aprovacao de escopo.**"
            echo "Aplique a label \`escopo-aprovado\` para a pipe criar as sub-issues"
            echo "e disparar a implementacao. Corrija a lista acima antes, se necessario."
          } > comment.md

          cat comment.md

          jq -Rs '{body: .}' comment.md > payload.json
          gh api "repos/$REPO/issues/$ISSUE/comments" --input payload.json

          gh api "repos/$REPO/issues/$ISSUE/labels" \
            -f "labels[]=estado/aguardando-escopo" >/dev/null

          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/estado%2Fnovo" >/dev/null 2>&1 || true
