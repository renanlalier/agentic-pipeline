name: agent-fanout (reusable)

# Passo 3 do fluxo, DEPOIS do HITL 1. Roda no repo de INTAKE.
# Cria uma sub-issue cross-repo por repositorio aprovado, marca ela com
# a label execution:<id> (para os workflows de comentario/label da fase
# de detalhamento recuperarem o execution_id sem payload de dispatch),
# e dispara o workflow de cada um.
#
# NOTA: tudo aqui e REST puro via `gh api`, incluindo o link de sub-issue
# (endpoint /issues/{n}/sub_issues, nao a mutation GraphQL addSubIssue).
# Tokens fine-grained tem suporte incompleto ao GraphQL do GitHub.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      PIPE_TOKEN:
        required: true

jobs:
  fanout:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Recuperar o escopo aprovado
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/issues/$ISSUE/comments" \
            --jq '[.[] | select(.body | contains("Escopo proposto pela pipe"))] | last | .body' \
            > escopo.md

          awk -F'|' '/^\| `/ {
            gsub(/[` ]/, "", $2); gsub(/[` ]/, "", $3);
            if ($2 != "" && $2 != "repositorio") print $2 "|" $3
          }' escopo.md > escopo.txt

          if [ ! -s escopo.txt ]; then
            echo "::error::Nao foi possivel recuperar o escopo aprovado da issue."
            echo "--- comentario lido ---"; cat escopo.md
            exit 1
          fi

          echo "--- escopo aprovado ---"; cat escopo.txt

      - name: Criar sub-issues cross-repo e disparar
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PARENT_REPO_FULL: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          CLI_OVERRIDE: ${{ inputs.cli_override }}
          MODEL_OVERRIDE: ${{ inputs.model_override }}
        run: |
          set -euo pipefail
          PARENT_REPO="${PARENT_REPO_FULL#*/}"

          gh api "repos/$PARENT_REPO_FULL/issues/$ISSUE" > parent.json
          PARENT_TITLE=$(jq -r .title parent.json)
          jq -r '.body // ""' parent.json > parent_body.txt

          while IFS='|' read -r REPO ROLE; do
            [ -z "$REPO" ] && continue
            echo "::group::$REPO ($ROLE)"

            {
              echo "Sub-issue gerada pela pipe agentica."
              echo ""
              echo "**Demanda de origem:** $OWNER/$PARENT_REPO#$ISSUE"
              echo "**execution_id:** \`$EXEC_ID\`"
              echo "**papel:** \`$ROLE\`"
              echo ""
              echo "---"
              echo ""
              cat parent_body.txt
            } > child_body.md

            jq -n --arg title "[$ROLE] $PARENT_TITLE" \
                  --rawfile body child_body.md \
                  '{title: $title, body: $body}' > create_payload.json

            gh api "repos/$OWNER/$REPO/issues" --input create_payload.json > child.json
            CHILD_NUM=$(jq -r .number child.json)
            CHILD_ID=$(jq -r .id child.json)
            echo "sub-issue criada: #$CHILD_NUM em $OWNER/$REPO"

            # link cross-repo via REST (endpoint de sub-issues, nao GraphQL)
            gh api "repos/$PARENT_REPO_FULL/issues/$ISSUE/sub_issues" \
              -F "sub_issue_id=$CHILD_ID" >/dev/null
            echo "linkada como sub-issue da pai"

            # marca a sub-issue com o execution_id - e assim que o
            # agent-plan e o agent-dev, disparados depois por comentario
            # ou por label (sem payload de dispatch), recuperam o id
            gh api "repos/$OWNER/$REPO/issues/$CHILD_NUM/labels" \
              -f "labels[]=execution:$EXEC_ID" >/dev/null
            echo "marcada com execution:$EXEC_ID"

            gh api "repos/$OWNER/$REPO/dispatches" \
              -f event_type=agent-dev \
              -f "client_payload[execution_id]=$EXEC_ID" \
              -f "client_payload[sub_issue]=$CHILD_NUM" \
              -f "client_payload[role]=$ROLE" \
              -f "client_payload[contract_ref]=v1" \
              -f "client_payload[cli_override]=$CLI_OVERRIDE" \
              -f "client_payload[model_override]=$MODEL_OVERRIDE"
            echo "repository_dispatch enviado"
            echo "::endgroup::"
          done < escopo.txt

      - name: Atualizar estado da issue pai
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/issues/$ISSUE/labels" \
            -f "labels[]=estado/implementando" >/dev/null
          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/estado%2Faguardando-escopo" >/dev/null 2>&1 || true

          MSG="Fan-out concluido. Cada repositorio agora roda seu proprio workflow, em VM propria, sem contexto compartilhado. A implementacao so comeca apos o plano tecnico ser aprovado na sub-issue."
          jq -n --arg body "$MSG" '{body: $body}' > comment_payload.json
          gh api "repos/$REPO/issues/$ISSUE/comments" --input comment_payload.json
