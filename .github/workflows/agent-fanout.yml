name: agent-fanout (reusable)

# Passo 3 do fluxo, DEPOIS do HITL 1. Roda no repo de INTAKE.
# Cria uma sub-issue cross-repo por repositorio aprovado e dispara
# o workflow de cada um. E aqui que se valida o cross-repo de verdade.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      PIPE_TOKEN:
        required: true

jobs:
  fanout:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Recuperar o escopo aprovado
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          # o escopo aprovado e a ultima tabela publicada pela etapa anterior
          gh issue view "$ISSUE" --repo "$REPO" \
            --json comments --jq '[.comments[] | select(.body | contains("Escopo proposto pela pipe"))] | last | .body' \
            > escopo.md

          # extrai "repo|papel" das linhas da tabela markdown
          awk -F'|' '/^\| `/ {
            gsub(/[` ]/, "", $2); gsub(/[` ]/, "", $3);
            if ($2 != "" && $2 != "repositorio") print $2 "|" $3
          }' escopo.md > escopo.txt

          if [ ! -s escopo.txt ]; then
            echo "::error::Nao foi possivel recuperar o escopo aprovado da issue."
            echo "--- comentario lido ---"; cat escopo.md
            exit 1
          fi

          echo "--- escopo aprovado ---"; cat escopo.txt

      - name: Criar sub-issues cross-repo e disparar
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PARENT_REPO_FULL: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          CLI_OVERRIDE: ${{ inputs.cli_override }}
          MODEL_OVERRIDE: ${{ inputs.model_override }}
        run: |
          set -euo pipefail
          PARENT_REPO="${PARENT_REPO_FULL#*/}"

          gh issue view "$ISSUE" --repo "$PARENT_REPO_FULL" \
            --json title,body > parent.json
          PARENT_TITLE=$(jq -r .title parent.json)
          jq -r '.body // ""' parent.json > parent_body.txt

          # node_id da issue pai, necessario para a mutation addSubIssue
          PARENT_ID=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){ issue(number:$num){ id } }
            }' -f owner="$OWNER" -f repo="$PARENT_REPO" -F num="$ISSUE" \
               --jq '.data.repository.issue.id')

          while IFS='|' read -r REPO ROLE; do
            [ -z "$REPO" ] && continue
            echo "::group::$REPO ($ROLE)"

            {
              echo "Sub-issue gerada pela pipe agentica."
              echo ""
              echo "**Demanda de origem:** $OWNER/$PARENT_REPO#$ISSUE"
              echo "**execution_id:** \`$EXEC_ID\`"
              echo "**papel:** \`$ROLE\`"
              echo ""
              echo "---"
              echo ""
              cat parent_body.txt
            } > child_body.md

            CHILD_URL=$(gh issue create --repo "$OWNER/$REPO" \
              --title "[$ROLE] $PARENT_TITLE" --body-file child_body.md)
            CHILD_NUM="${CHILD_URL##*/}"
            echo "sub-issue criada: $CHILD_URL"

            CHILD_ID=$(gh api graphql -f query='
              query($owner:String!,$repo:String!,$num:Int!){
                repository(owner:$owner,name:$repo){ issue(number:$num){ id } }
              }' -f owner="$OWNER" -f repo="$REPO" -F num="$CHILD_NUM" \
                 --jq '.data.repository.issue.id')

            # linkar como sub-issue da pai - cross-repo
            gh api graphql -f query='
              mutation($parent:ID!,$child:ID!){
                addSubIssue(input:{issueId:$parent, subIssueId:$child}){
                  issue { number }
                }
              }' -f parent="$PARENT_ID" -f child="$CHILD_ID" >/dev/null
            echo "linkada como sub-issue da pai"

            # disparar o workflow do repo de produto
            gh api "repos/$OWNER/$REPO/dispatches" \
              -f event_type=agent-dev \
              -f "client_payload[execution_id]=$EXEC_ID" \
              -f "client_payload[sub_issue]=$CHILD_NUM" \
              -f "client_payload[role]=$ROLE" \
              -f "client_payload[contract_ref]=v1" \
              -f "client_payload[cli_override]=$CLI_OVERRIDE" \
              -f "client_payload[model_override]=$MODEL_OVERRIDE"
            echo "repository_dispatch enviado"
            echo "::endgroup::"
          done < escopo.txt

      - name: Atualizar estado da issue pai
        env:
          GH_TOKEN: ${{ secrets.PIPE_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" \
            --add-label "estado/implementando" \
            --remove-label "estado/aguardando-escopo" || true

          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Fan-out concluido. Cada repositorio agora roda seu proprio workflow, em VM propria, sem contexto compartilhado. Repare que eles terminam fora de ordem e nenhum sabe do outro."
