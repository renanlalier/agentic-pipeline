name: agent-dispatch (reusable)

# Step 3 of the flow, AFTER HITL 2 (contracts-approved). Runs in the INTAKE repo.
# Creates one cross-repo sub-issue per approved repository, marks it with
# the label execution:<id> (so that comment/label-driven workflows in the
# planning phase can recover the execution_id without a dispatch payload),
# and triggers the planning workflow of each product repo.
#
# NOTE: everything here uses pure REST via `gh api`, including the sub-issue
# link (endpoint /issues/{n}/sub_issues, not the addSubIssue GraphQL mutation).
# Fine-grained tokens have incomplete GraphQL support.

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      execution_id:
        required: true
        type: string
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: true
        description: "GitHub App ID for generating a scoped installation token"
      APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key (PEM) for generating a scoped installation token"

jobs:
  fanout:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Recover contracts and scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          # Recover the contracts comment (posted by agent-contracts, ends with <!-- pipe:contracts -->)
          gh api "repos/$REPO/issues/$ISSUE/comments" \
            --jq '[.[] | select(.body | contains("<!-- pipe:contracts -->"))] | last | .body // ""' \
            > contracts_raw.md

          if [ ! -s contracts_raw.md ]; then
            echo "::error::No contracts comment (<!-- pipe:contracts -->) found on issue #$ISSUE."
            echo "Make sure agent-contracts ran and the contracts-approved label was applied after."
            exit 1
          fi

          # Extract scope (repo|role|type) from <!-- repo-brief:REPO:ROLE:TYPE --> opening markers.
          # Closing markers (<!-- /repo-brief:... -->) are skipped by the [^/] guard.
          awk 'match($0, /<!-- repo-brief:[^/]/) {
            line = $0
            sub(/.*<!-- repo-brief:/, "", line)
            sub(/ -->.*/, "", line)
            n = split(line, parts, ":")
            repo = parts[1]; role = parts[2]; type = parts[3]
            gsub(/ /, "", repo); gsub(/ /, "", role); gsub(/ /, "", type)
            if (type == "") type = "task"
            if (repo != "") print repo "|" role "|" type
          }' contracts_raw.md > scope.txt

          if [ ! -s scope.txt ]; then
            echo "::error::No repo-brief markers found in the contracts comment."
            echo "--- contracts comment ---"; cat contracts_raw.md
            exit 1
          fi

          echo "--- approved scope (from repo-brief markers) ---"
          cat scope.txt

          # Extract the section between contracts-begin / contracts-end delimiters
          awk '/<!-- contracts-begin -->/{found=1; next} /<!-- contracts-end -->/{found=0} found' \
            contracts_raw.md > contracts.md

          echo "--- integration contracts ---"
          if [ -s contracts.md ]; then cat contracts.md; else echo "(none)"; fi

      - name: Create cross-repo sub-issues and dispatch planning
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PARENT_REPO_FULL: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          EXEC_ID: ${{ inputs.execution_id }}
          CLI_OVERRIDE: ${{ inputs.cli_override }}
          MODEL_OVERRIDE: ${{ inputs.model_override }}
        run: |
          set -euo pipefail
          PARENT_REPO="${PARENT_REPO_FULL#*/}"

          gh api "repos/$PARENT_REPO_FULL/issues/$ISSUE" > parent.json
          PARENT_TITLE=$(jq -r .title parent.json)
          PARENT_AUTHOR=$(jq -r '.user.login' parent.json)
          jq -r '.body // ""' parent.json > parent_body.txt

          while IFS='|' read -r REPO ROLE ISSUE_TYPE; do
            [ -z "$REPO" ] && continue
            echo "::group::$REPO ($ROLE, type=$ISSUE_TYPE)"

            # Extract this repo's implementation brief from the contracts document
            # Opening marker format: <!-- repo-brief:REPO:ROLE:TYPE --> (colon after repo name)
            awk "/<!-- repo-brief:${REPO}:/{found=1; next} /<!-- \/repo-brief:${REPO} -->/{found=0} found" \
              contracts_raw.md > repo_brief.md

            {
              echo "Sub-issue generated by the agentic pipeline."
              echo ""
              echo "**Origin:** $OWNER/$PARENT_REPO#$ISSUE"
              echo "**execution_id:** \`$EXEC_ID\`"
              echo "**Role:** \`$ROLE\`"
              echo "**Type:** \`$ISSUE_TYPE\`"
              echo ""
              echo "---"
              echo ""
              echo "## Task Brief"
              echo ""
              if [ -s repo_brief.md ]; then
                cat repo_brief.md
              else
                cat parent_body.txt
              fi
              echo ""
              echo "---"
              echo ""
              echo "## Integration Contracts"
              echo ""
              if [ -s contracts.md ]; then
                cat contracts.md
              else
                echo "_(No cross-repository integration contracts apply to this demand.)_"
              fi
            } > child_body.md

            jq -n --arg title "[$ROLE] $PARENT_TITLE" \
                  --rawfile body child_body.md \
                  '{title: $title, body: $body}' > create_payload.json

            gh api "repos/$OWNER/$REPO/issues" --input create_payload.json > child.json
            CHILD_NUM=$(jq -r .number child.json)
            CHILD_ID=$(jq -r .id child.json)
            echo "sub-issue created: #$CHILD_NUM in $OWNER/$REPO"

            # link cross-repo via REST (sub-issues endpoint, not GraphQL)
            gh api "repos/$PARENT_REPO_FULL/issues/$ISSUE/sub_issues" \
              -F "sub_issue_id=$CHILD_ID" >/dev/null
            echo "linked as sub-issue of parent"

            # stamp the sub-issue with execution_id — this is how agent-plan
            # and agent-dev, triggered later by comment or label (with no
            # dispatch payload), recover the id
            gh api "repos/$OWNER/$REPO/issues/$CHILD_NUM/labels" \
              -f "labels[]=execution:$EXEC_ID" >/dev/null
            echo "stamped with execution:$EXEC_ID"

            # stamp the demand type label
            gh api "repos/$OWNER/$REPO/issues/$CHILD_NUM/labels" \
              -f "labels[]=type/$ISSUE_TYPE" >/dev/null
            echo "stamped with type/$ISSUE_TYPE"

            # stamp the requester so agent-plan and agent-dev can recover it
            # without access to the parent repo
            gh api "repos/$OWNER/$REPO/issues/$CHILD_NUM/labels" \
              -f "labels[]=requester:$PARENT_AUTHOR" >/dev/null
            echo "stamped with requester:$PARENT_AUTHOR"

            gh api "repos/$OWNER/$REPO/dispatches" \
              -f event_type=agent-plan \
              -f "client_payload[execution_id]=$EXEC_ID" \
              -f "client_payload[sub_issue]=$CHILD_NUM" \
              -f "client_payload[role]=$ROLE" \
              -f "client_payload[contract_ref]=v1" \
              -f "client_payload[cli_override]=$CLI_OVERRIDE" \
              -f "client_payload[model_override]=$MODEL_OVERRIDE" \
              -f "client_payload[requester]=$PARENT_AUTHOR"
            echo "repository_dispatch sent (agent-plan)"
            echo "::endgroup::"
          done < scope.txt

      - name: Update parent issue state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/issues/$ISSUE/labels" \
            -f "labels[]=implementing" >/dev/null
          gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/awaiting-scope-approval" >/dev/null 2>&1 || true

          MSG="Fan-out complete. Each sub-issue includes the integration contracts defined by the Tech Lead. Each repository runs its own workflow in its own VM. Implementation only starts after the technical plan is approved on the sub-issue."
          jq -n --arg body "$MSG" '{body: $body}' > comment_payload.json
          gh api "repos/$REPO/issues/$ISSUE/comments" --input comment_payload.json
