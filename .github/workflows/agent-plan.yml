name: agent-plan (reusable)

# Runs INSIDE the product repo, on the SUB-ISSUE. One or more times:
# on sub-issue creation, and again for each human comment while the plan
# has not been approved. Uses the repo's own role (frontend-engineer or
# backend-engineer) + the writing-plans skill (with the iteration section).
#
# status "ask"      -> posts a question OR the proposed plan (kind indicates
#                      which), keeps status-planning
# status "approved" -> marks the last published plan as final
#                      (<!-- pipe:plan-final -->), adds plan-approved label
#                      (the caller listens for this label to trigger
#                      agent-dev for implementation), and fills the
#                      ## Technical Scope section in the sub-issue body
# status "escalated" -> posts the reason and stops
#
# execution_id is OPTIONAL here: on the first turn it comes from the
# dispatch payload; on subsequent turns (triggered by comment, with no
# payload) it is recovered from the "execution:<id>" label that
# agent-dispatch applied to the sub-issue when it created it.

on:
  workflow_call:
    inputs:
      sub_issue:
        required: true
        type: number
      role:
        required: true
        type: string
      execution_id:
        required: false
        type: string
        default: ""
      contract_ref:
        required: false
        type: string
        default: "v1"
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
      execution_target:
        required: false
        type: string
        default: ""
      github_token:
        required: false
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout platform
        uses: actions/checkout@v4
        with:
          repository: renanlalier/agentic-pipeline
          ref: v1
          path: .platform

      - name: Resolve execution_id (input or sub-issue label)
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          EXEC_ID="${{ inputs.execution_id }}"
          if [ -z "$EXEC_ID" ]; then
            EXEC_ID=$(gh api "repos/$REPO/issues/$SUB_ISSUE" --jq '.labels[].name' \
              | grep '^execution:' | sed 's/^execution://' | head -1 || true)
          fi
          if [ -z "$EXEC_ID" ]; then
            echo "::error::execution_id was not provided as input and no execution:* label exists on the sub-issue."
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "resolved: $EXEC_ID"

      - name: Build conversation (sub-issue + comments so far)
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$SUB_ISSUE" > subissue.json
          TITLE=$(jq -r '.title' subissue.json)
          BODY=$(jq -r '.body // ""' subissue.json)

          gh api "repos/$REPO/issues/$SUB_ISSUE/comments" > comments.json
          N=$(jq 'length' comments.json)

          DELIM=$(openssl rand -hex 16)
          {
            echo "prompt<<$DELIM"
            echo "MODE: ITERATIVE_PLANNING"
            echo ""
            echo "## Sub-issue"
            echo "$TITLE"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Reference contract"
            echo "${{ inputs.contract_ref }}"
            echo ""
            if [ "$N" -gt 0 ]; then
              echo "## Conversation so far ($N comment(s), in order)"
              echo "Comments marked with [PIPE] are your own previous turns;"
              echo "the others are from the human."
              jq -r '.[] | (if (.body | contains("<!-- pipe:plan -->")) then "**[PIPE]**" else "**[HUMAN] \(.user.login)**" end) + "\n" + .body + "\n"' comments.json
            else
              echo "## Conversation so far"
              echo "(no comments yet — this is the first turn)"
            fi
            echo ""
            echo "## Instruction"
            echo "Apply the writing-plans skill, iteration section. Respond"
            echo "using THIS format for this call (not the default output_format"
            echo "from your system.md, which is only for the implementation phase):"
            echo '{"role","execution_id","status":"ask|approved|escalated",'
            echo ' "kind":"question|plan","content","notes"}'
            echo "Use kind=plan when content is the proposed plan; kind=question"
            echo "when it is a question. status=approved only when the last"
            echo "HUMAN comment explicitly approves a prior [PIPE] plan."
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          echo "comment rounds so far: $N"

      - name: Execute role (planning turn)
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: ${{ inputs.role }}
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ steps.exec.outputs.execution_id }}
          prompt: ${{ steps.context.outputs.prompt }}
          platform_path: .platform
          execution_target: ${{ inputs.execution_target }}
          issue_number: ${{ inputs.sub_issue }}
          repo_full_name: ${{ github.repository }}
          github_token: ${{ inputs.github_token != '' && inputs.github_token || github.token }}

      - name: Act on agent decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_RESULT: ${{ steps.agent.outputs.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AGENT_RESULT" > agent_result.json

          echo "--- agent output ---"
          cat agent_result.json

          if ! jq empty agent_result.json 2>/dev/null; then
            echo "::error::Agent output is not valid JSON."
            exit 1
          fi

          STATUS=$(jq -r '.status' agent_result.json)

          case "$STATUS" in
            dispatched_to_cloud)
              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=status-planning" >/dev/null
              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=status-awaiting-codex-response" >/dev/null
              echo "Dispatched to Codex Cloud — waiting for planning bot response on sub-issue #$SUB_ISSUE."
              ;;

            ask)
              KIND=$(jq -r '.kind' agent_result.json)
              CONTENT=$(jq -r '.content' agent_result.json)
              if [ "$KIND" = "plan" ]; then
                HEADER="## Proposed plan"
              else
                HEADER="## Question"
              fi
              {
                echo "$HEADER"
                echo ""
                echo "$CONTENT"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: planning_"
                echo "<!-- pipe:plan -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=status-planning" >/dev/null
              ;;

            approved)
              # mark the last comment with "## Proposed plan" as the final plan,
              # so agent-dev (implementation) can find it without re-reading the
              # entire conversation
              LAST_PLAN_ID=$(gh api "repos/$REPO/issues/$SUB_ISSUE/comments" \
                --jq '[.[] | select(.body | contains("## Proposed plan"))] | last | .id')

              APPROVED_PLAN_CONTENT=""
              if [ -n "$LAST_PLAN_ID" ] && [ "$LAST_PLAN_ID" != "null" ]; then
                CURRENT=$(gh api "repos/$REPO/issues/comments/$LAST_PLAN_ID" --jq '.body')
                APPROVED_PLAN_CONTENT="$CURRENT"
                NEW_BODY=$(printf '%s\n<!-- pipe:plan-final -->' "$CURRENT")
                jq -n --arg body "$NEW_BODY" '{body: $body}' > mark_payload.json
                gh api -X PATCH "repos/$REPO/issues/comments/$LAST_PLAN_ID" --input mark_payload.json
              else
                echo "::warning::No comment with '## Proposed plan' found to mark as final."
              fi

              # fill ## Technical Scope in the sub-issue body with the approved plan
              CURRENT_BODY=$(jq -r '.body // ""' subissue.json)
              export APPROVED_PLAN_CONTENT
              NEW_ISSUE_BODY=$(awk '
                BEGIN{plan=ENVIRON["APPROVED_PLAN_CONTENT"]; done=0}
                /^## Technical Scope/{
                  print; print "";
                  print plan;
                  skip=1; done=1; next
                }
                skip && /^## /{ skip=0 }
                skip{ next }
                { print }
              ' <<< "$CURRENT_BODY")

              jq -n --arg body "$NEW_ISSUE_BODY" '{body: $body}' > body_payload.json
              gh api -X PATCH "repos/$REPO/issues/$SUB_ISSUE" --input body_payload.json
              echo "Technical Scope section filled in sub-issue body"

              {
                echo "**Plan approved.** Proceeding to implementation."
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: planning concluded_"
                echo "<!-- pipe:plan -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=plan-approved" >/dev/null
              gh api -X DELETE "repos/$REPO/issues/$SUB_ISSUE/labels/status-planning" >/dev/null 2>&1 || true
              ;;

            escalated)
              NOTES=$(jq -r '.notes' agent_result.json)
              {
                echo "## Planning escalated"
                echo ""
                echo "$NOTES"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL)_"
                echo "<!-- pipe:plan -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input payload.json
              exit 1
              ;;

            *)
              echo "::error::Unknown status: $STATUS"
              exit 1
              ;;
          esac
