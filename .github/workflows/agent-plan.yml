name: agent-plan (reusable)

# Runs INSIDE the product repo, on the SUB-ISSUE. One or more times:
# on sub-issue creation (via repository_dispatch from agent-dispatch) and
# again after a tech-lead revision request (re-dispatched by agent-plan-review).
# Uses the repo's own role (frontend-engineer or backend-engineer) +
# the writing-plans skill (with the iteration section).
#
# status "ok"       -> posts the proposed plan with <!-- pipe:plan -->,
#                      applies plan-review-requested; Tech Lead reviews
#                      automatically via agent-plan-review.yml
# status "escalated" -> posts the reason and stops (human must intervene)
#
# execution_id is OPTIONAL: on the first turn it comes from the dispatch
# payload; on re-turns it comes from the dispatch payload sent by agent-plan-review.

on:
  workflow_call:
    inputs:
      sub_issue:
        required: true
        type: string
      role:
        required: true
        type: string
      execution_id:
        required: false
        type: string
        default: ""
      contract_ref:
        required: false
        type: string
        default: "v1"
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
      execution_target:
        required: false
        type: string
        default: ""
      github_token:
        required: false
        type: string
        default: ""
      secrets_source:
        required: false
        type: string
        default: ""
      requester:
        required: false
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout platform
        uses: actions/checkout@v4
        with:
          repository: renanlalier/agentic-pipeline
          ref: v1
          path: .platform

      - name: Install yq
        run: |
          if ! command -v yq &>/dev/null; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

      - name: Resolve secrets_source (level 3 → 2)
        id: secrets_src
        run: |
          set -euo pipefail
          SRC="${{ inputs.secrets_source }}"
          [ -z "$SRC" ] && SRC=$(yq -r '.secrets.source // ""' .agentic/config.yml 2>/dev/null || echo "")
          [ -z "$SRC" ] && SRC="github-secrets"
          echo "secrets_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "Secrets source resolved to: $SRC"

      - name: Azure login (vault source)
        if: steps.secrets_src.outputs.secrets_source == 'vault'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Export vault env vars (vault source)
        if: steps.secrets_src.outputs.secrets_source == 'vault'
        run: echo "AZURE_VAULT_URL=${{ vars.AZURE_VAULT_URL }}" >> "$GITHUB_ENV"

      - name: Resolve execution_id (input or sub-issue label)
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          EXEC_ID="${{ inputs.execution_id }}"
          if [ -z "$EXEC_ID" ]; then
            EXEC_ID=$(gh api "repos/$REPO/issues/$SUB_ISSUE" --jq '.labels[].name' \
              | grep '^execution:' | sed 's/^execution://' | head -1 || true)
          fi
          if [ -z "$EXEC_ID" ]; then
            echo "::error::execution_id was not provided as input and no execution:* label exists on the sub-issue."
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"
          echo "resolved: $EXEC_ID"

      - name: Build conversation (sub-issue + last 5 comments)
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$SUB_ISSUE" > subissue.json
          # Priority: (1) workflow input from dispatch payload, (2) requester: label on sub-issue
          REQUESTER="${{ inputs.requester }}"
          if [ -z "$REQUESTER" ]; then
            REQUESTER=$(jq -r '.labels[].name' subissue.json \
              | grep '^requester:' | sed 's/^requester://' | head -1 || true)
          fi
          echo "requester=$REQUESTER" >> "$GITHUB_OUTPUT"
          TITLE=$(jq -r '.title' subissue.json)
          BODY=$(jq -r '.body // ""' subissue.json)

          gh api "repos/$REPO/issues/$SUB_ISSUE/comments" > all_comments.json
          TOTAL=$(jq 'length' all_comments.json)
          jq '.[-5:]' all_comments.json > comments.json
          N=$(jq 'length' comments.json)

          DELIM=$(openssl rand -hex 16)
          {
            echo "prompt<<$DELIM"
            echo "MODE: ITERATIVE_PLANNING"
            echo ""
            echo "## Sub-issue"
            echo "$TITLE"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Reference contract"
            echo "${{ inputs.contract_ref }}"
            echo ""
            if [ "$TOTAL" -gt 0 ]; then
              echo "## Conversation so far (last $N of $TOTAL comment(s), in order)"
              echo "Comments marked with [PIPE] are your own previous plans;"
              echo "[TECH-LEAD REVIEW] comments contain the tech-lead's evaluation — incorporate all revision feedback before resubmitting."
              jq -r '.[] | (
                if (.body | contains("<!-- pipe:plan-review -->")) then "**[TECH-LEAD REVIEW]**"
                elif (.body | contains("<!-- pipe:plan -->")) then "**[PIPE — your previous plan]**"
                else "**[HUMAN] \(.user.login)**"
                end
              ) + "\n" + .body + "\n"' comments.json
            else
              echo "## Conversation so far"
              echo "(no comments yet — this is the first turn)"
            fi
            echo ""
            echo "## Instruction"
            echo "Apply the writing-plans skill, iteration section."
            echo "For this planning phase (not the implementation phase), use this output format:"
            echo "- Write natural language markdown."
            echo "- Start the content block with '## Proposed plan'."
            echo "- If prior [PIPE-REVIEW] comments exist, incorporate their specific feedback before re-proposing."
            echo "- End your response with exactly one status marker on its own line:"
            echo "  <!-- codex:status:ok --> when your plan is complete and ready for tech-lead review"
            echo "  <!-- codex:status:escalated --> to stop and request human intervention"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          echo "comment rounds so far: $TOTAL (sending last $N)"

      - name: Execute role (planning turn)
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: ${{ inputs.role }}
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ steps.exec.outputs.execution_id }}
          prompt: ${{ steps.context.outputs.prompt }}
          platform_path: .platform
          execution_target: ${{ inputs.execution_target }}
          issue_number: ${{ inputs.sub_issue }}
          repo_full_name: ${{ github.repository }}
          github_token: ${{ inputs.github_token != '' && inputs.github_token || github.token }}
          requester: ${{ steps.context.outputs.requester }}
          secrets_source: ${{ steps.secrets_src.outputs.secrets_source }}

      - name: Act on agent decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_BODY: ${{ steps.agent.outputs.body }}
          STATUS: ${{ steps.agent.outputs.status }}
        run: |
          set -euo pipefail

          echo "--- agent output (status: $STATUS) ---"
          printf '%s\n' "$AGENT_BODY"

          case "$STATUS" in
            dispatched_to_cloud)
              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=planning" >/dev/null
              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=awaiting-agent-response" >/dev/null
              echo "Dispatched to Codex Cloud — waiting for planning bot response on sub-issue #$SUB_ISSUE."
              ;;

            ok)
              {
                printf '%s\n' "$AGENT_BODY"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL) · phase: planning_"
                echo "<!-- pipe:plan -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input payload.json

              gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
                -f "labels[]=plan-review-requested" >/dev/null
              gh api -X DELETE "repos/$REPO/issues/$SUB_ISSUE/labels/planning" >/dev/null 2>&1 || true
              echo "Plan posted — plan-review-requested label applied. Tech Lead will review automatically."
              ;;

            escalated)
              {
                printf '%s\n' "$AGENT_BODY"
                echo ""
                echo "---"
                echo "_\`execution_id\`: \`$EXEC_ID\` · [run for this step]($RUN_URL)_"
                echo "<!-- pipe:plan -->"
              } > comment.md
              jq -Rs '{body: .}' comment.md > payload.json
              gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input payload.json
              exit 1
              ;;

            *)
              echo "::error::Unknown status: $STATUS"
              exit 1
              ;;
          esac
