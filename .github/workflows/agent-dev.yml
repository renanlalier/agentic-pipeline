name: agent-dev (reusable)

# IMPLEMENTATION phase. Runs INSIDE the product repo, triggered when the
# sub-issue receives the plan-approved label (i.e., after the agent-plan.yml
# loop has converged with explicit human approval).
# github.repository here is the consumer repo — only the FILE came from the platform.
#
# execution_id is OPTIONAL: if not provided as input, it is recovered from the
# "execution:<id>" label that agent-dispatch applied to the sub-issue on creation —
# same mechanism as agent-plan.yml, because the issues.labeled trigger also has
# no access to the original dispatch payload.
#
# SECRETS: provider keys are declared as OPTIONAL so that `cli: dry-run` works
# with no key at all. They are exposed at job level so every step — including
# the composite run-agent action and the adapter it dispatches to — inherits
# them. A missing key for a non-dry-run CLI fails in the preflight step below
# with an actionable message, instead of failing deep inside the adapter.

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      sub_issue:
        required: true
        type: string
      execution_id:
        required: false
        type: string
        default: ""
      contract_ref:
        required: false
        type: string
        default: "v1"
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""
      execution_target:
        required: false
        type: string
        default: ""
      github_token:
        required: false
        type: string
        default: ""
      secrets_source:
        description: "Override secrets.source from .agentic/config.yml. 'github-secrets' | 'vault'"
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: "Required when the resolved CLI is claude-code."
        required: false
      OPENAI_API_KEY:
        description: "Required when the resolved CLI is codex."
        required: false
      CURSOR_API_KEY:
        description: "Required when the resolved CLI is cursor."
        required: false
      CONTEXT7_API_KEY:
        description: "Optional. Consumed by MCP servers declared in brain/mcp/servers.yml."
        required: false

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # required for OIDC vault authentication when secrets_source: vault
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      # Azure vault variables — set as Actions variables (not secrets) on the repo or org.
      # Used when secrets_source resolves to 'vault'.
      AZURE_VAULT_URL: ${{ vars.AZURE_VAULT_URL }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/agentic-pipeline
          ref: v1
          path: .platform

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve secrets_source (level 3 → 2)
        id: secrets_src
        run: |
          set -euo pipefail
          SRC="${{ inputs.secrets_source }}"
          [ -z "$SRC" ] && SRC=$(yq -r '.secrets.source // ""' .agentic/config.yml 2>/dev/null || echo "")
          [ -z "$SRC" ] && SRC="github-secrets"
          echo "secrets_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "Secrets source resolved to: $SRC"

      - name: Preflight — provider key for the resolved CLI
        run: |
          set -euo pipefail

          # Mirror the level 3 -> 2 -> 1 resolution that run-agent performs, far
          # enough to know WHICH key is needed. run-agent remains the authority
          # on validation against the allowlist; this is only a fast, readable
          # failure before we branch, commit, and push anything.
          CLI="${{ inputs.cli_override }}"
          [ -z "$CLI" ] && CLI=$(yq -r '.defaults.cli // ""' .agentic/config.yml 2>/dev/null || echo "")
          [ -z "$CLI" ] && CLI="dry-run"

          # When using vault, the key is fetched at runtime by run-agent — skip the
          # presence check here. A missing or invalid vault secret fails later with
          # a clear error from the vault provider.
          SECRETS_SOURCE="${{ steps.secrets_src.outputs.secrets_source }}"
          if [ "$SECRETS_SOURCE" = "vault" ]; then
            echo "cli '$CLI' — secrets from vault, skipping GitHub Secrets presence check"
            exit 0
          fi

          case "$CLI" in
            claude-code) REQUIRED_KEY="ANTHROPIC_API_KEY" ;;
            codex)       REQUIRED_KEY="OPENAI_API_KEY" ;;
            cursor)      REQUIRED_KEY="CURSOR_API_KEY" ;;
            dry-run)     REQUIRED_KEY="" ;;
            *)           REQUIRED_KEY="" ;;
          esac

          if [ -n "$REQUIRED_KEY" ] && [ -z "${!REQUIRED_KEY:-}" ]; then
            echo "::error::cli '$CLI' requires the secret $REQUIRED_KEY, which did not arrive in this run. Add it to this repository (Settings > Secrets and variables > Actions) AND forward it in the caller workflow's secrets: block. Use cli: dry-run to run the mechanics without a key."
            exit 1
          fi

          echo "cli '$CLI' — provider key: ${REQUIRED_KEY:-none required}"

      - name: Azure login (vault source)
        if: steps.secrets_src.outputs.secrets_source == 'vault'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve execution_id (input or sub-issue label)
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          EXEC_ID="${{ inputs.execution_id }}"
          if [ -z "$EXEC_ID" ]; then
            EXEC_ID=$(gh api "repos/$REPO/issues/$SUB_ISSUE" --jq '.labels[].name' \
              | grep '^execution:' | sed 's/^execution://' | head -1 || true)
          fi
          if [ -z "$EXEC_ID" ]; then
            echo "::error::execution_id was not provided as input and no execution:* label exists on the sub-issue."
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"

      - name: Prove isolation
        run: |
          echo "### Run isolation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- repository: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- run id: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- execution id: \`${{ steps.exec.outputs.execution_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- runner: \`$(hostname)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workspace contents (only this repo is on disk):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 | grep -v '^\.platform$' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check repo constraints
        run: |
          set -euo pipefail
          if [ -f .agentic/config.yml ]; then
            echo "Paths forbidden for the agent in this repo:"
            yq -r '.constraints.forbid_paths[]?' .agentic/config.yml || true
          fi

      - name: Resolve execution target
        id: mode
        run: |
          set -euo pipefail
          EXEC_TARGET="${{ inputs.execution_target }}"
          if [ -z "$EXEC_TARGET" ]; then
            EXEC_TARGET=$(yq -r '.defaults.execution_target // ""' .agentic/config.yml 2>/dev/null || echo "")
          fi
          [ -z "$EXEC_TARGET" ] && EXEC_TARGET="local"
          echo "target=$EXEC_TARGET" >> "$GITHUB_OUTPUT"
          echo "Execution target resolved to: $EXEC_TARGET"

      - name: Read the approved plan
        id: plano
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          PLANO=$(gh api "repos/$REPO/issues/$SUB_ISSUE/comments" \
            --jq '[.[] | select(.body | contains("<!-- pipe:plan-final -->"))] | last | .body // ""')

          if [ -z "$PLANO" ]; then
            echo "::warning::No comment marked as the final plan was found. Implementing without an explicit plan."
            PLANO="(no planning detail was found for this sub-issue)"
          fi

          {
            echo "plano<<PLANOEOF"
            echo "$PLANO"
            echo "PLANOEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create working branch
        if: steps.mode.outputs.target != 'cloud'
        env:
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
        run: |
          git config user.name  "agentic-${{ inputs.role }}"
          git config user.email "agentic@users.noreply.github.com"
          git checkout -b "agentic/$EXEC_ID"

      - name: Execute role (implementation)
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: ${{ inputs.role }}
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ steps.exec.outputs.execution_id }}
          prompt: "Implement sub-issue #${{ inputs.sub_issue }} of this repository, respecting contract ${{ inputs.contract_ref }} and the approved plan below. Do not reopen decomposition decisions already closed in the plan — implement what it describes.\n\n${{ steps.plano.outputs.plano }}"
          platform_path: .platform
          execution_target: ${{ steps.mode.outputs.target }}
          issue_number: ${{ inputs.sub_issue }}
          repo_full_name: ${{ github.repository }}
          github_token: ${{ inputs.github_token != '' && inputs.github_token || github.token }}
          secrets_source: ${{ steps.secrets_src.outputs.secrets_source }}

      - name: Apply cloud dispatch labels
        if: steps.mode.outputs.target == 'cloud'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          gh api "repos/$REPO/issues/$SUB_ISSUE/labels" \
            -f "labels[]=awaiting-agent-response" >/dev/null
          echo "Dispatched to Codex Cloud — waiting for implementation bot response on sub-issue #$SUB_ISSUE."

      - name: Materialize the change
        if: steps.mode.outputs.target != 'cloud'
        env:
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          ROLE: ${{ inputs.role }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## $EXEC_ID"
            echo ""
            echo "- role: \`$ROLE\`"
            echo "- cli: \`$CLI\`"
            echo "- model: \`$MODEL\`"
            echo "- sub-issue: #$SUB_ISSUE"
            echo "- contract: \`$CONTRACT_REF\`"
            echo "- run: $RUN_URL"
            echo ""
          } >> CHANGELOG-agentic.md

          git add CHANGELOG-agentic.md
          git commit -m "feat: $ROLE for #$SUB_ISSUE (exec $EXEC_ID)"
          git push origin "agentic/$EXEC_ID"

      - name: Open draft pull request (REST)
        if: steps.mode.outputs.target != 'cloud'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          ROLE: ${{ inputs.role }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          set -euo pipefail
          {
            echo "Generated by the agentic pipeline."
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| execution_id | \`$EXEC_ID\` |"
            echo "| role | \`$ROLE\` |"
            echo "| cli | \`$CLI\` |"
            echo "| model | \`$MODEL\` |"
            echo "| contract | \`$CONTRACT_REF\` |"
            echo ""
            echo "Closes #$SUB_ISSUE"
            echo ""
            echo "---"
            echo "**Human review required** — the app that opened this PR cannot approve it."
          } > pr_body.md

          jq -n \
            --arg title "[agentic] $ROLE — sub-issue #$SUB_ISSUE" \
            --rawfile body pr_body.md \
            --arg head "agentic/$EXEC_ID" \
            --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base, draft: true}' \
            > pr_payload.json

          gh api "repos/$REPO/pulls" --input pr_payload.json > pr.json
          echo "PR created: $(jq -r .html_url pr.json)"

      - name: Validate and prune memory files
        if: always()
        run: |
          MEMORY_DIR=".agentic/memory"
          [ -d "$MEMORY_DIR" ] || exit 0

          # Security check: warn if memory files contain forbidden XML tags.
          # The run-agent action already blocked injection for this run; this
          # step flags it in the job summary so the team can investigate.
          for f in "$MEMORY_DIR/AGENTS.md" "$MEMORY_DIR/MEMORY.md"; do
            [ -f "$f" ] || continue
            if grep -qE '<(role|instructions|constraints|stop_conditions)>' "$f"; then
              echo "::warning file=$f::Memory file contains forbidden XML tags. It was skipped during injection and should be reviewed."
            fi
          done

          # Prune oldest episodes when the limit is exceeded.
          MAX=$(yq -r '.memory.max_episodes // 20' .agentic/config.yml 2>/dev/null || echo 20)
          EPISODE_DIR="$MEMORY_DIR/episodes"
          if [ -d "$EPISODE_DIR" ]; then
            EPISODE_FILES=$(ls "$EPISODE_DIR"/*.md 2>/dev/null || true)
            COUNT=$(echo "$EPISODE_FILES" | grep -c '\.md$' || true)
            if (( COUNT > MAX )); then
              TO_DELETE=$(( COUNT - MAX ))
              ls -t "$EPISODE_DIR"/*.md | tail -n "$TO_DELETE" | xargs rm -f
              echo "Pruned $TO_DELETE old episode(s) from $EPISODE_DIR (keeping $MAX)."
            fi
          fi

      - name: Report on sub-issue (REST)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MSG="Implementation complete in \`$REPO\`. Run: $RUN_URL"
          jq -n --arg body "$MSG" '{body: $body}' > comment_payload.json
          gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input comment_payload.json
