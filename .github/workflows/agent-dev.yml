name: agent-dev (reusable)

# Fase de IMPLEMENTACAO. Roda DENTRO do repo de produto, disparado
# quando a sub-issue recebe a label plano-aprovado (ou seja, depois que
# o loop do agent-plan.yml ja convergiu com aprovacao humana explicita).
# github.repository aqui e o repo consumidor - so o ARQUIVO veio da platform.
#
# execution_id e OPCIONAL: se nao vier no input, e recuperado da label
# "execution:<id>" que o agent-fanout aplicou na sub-issue na criacao -
# mesmo mecanismo do agent-plan.yml, porque quem dispara este workflow
# via issues.labeled tambem nao tem acesso ao payload original.

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      sub_issue:
        required: true
        type: number
      execution_id:
        required: false
        type: string
        default: ""
      contract_ref:
        required: false
        type: string
        default: "v1"
      cli_override:
        required: false
        type: string
        default: ""
      model_override:
        required: false
        type: string
        default: ""

jobs:
  implementar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout deste repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout da platform
        uses: actions/checkout@v5
        with:
          repository: renanlalier/poc-agentic-platform
          ref: v1
          path: .platform

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolver execution_id (input ou label da sub-issue)
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          EXEC_ID="${{ inputs.execution_id }}"
          if [ -z "$EXEC_ID" ]; then
            EXEC_ID=$(gh api "repos/$REPO/issues/$SUB_ISSUE" --jq '.labels[].name' \
              | grep '^execution:' | sed 's/^execution://' | head -1 || true)
          fi
          if [ -z "$EXEC_ID" ]; then
            echo "::error::execution_id nao veio no input e nao ha label execution:* na sub-issue."
            exit 1
          fi
          echo "execution_id=$EXEC_ID" >> "$GITHUB_OUTPUT"

      - name: Provar o isolamento
        run: |
          echo "### Isolamento deste run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- repositorio: \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- run id: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- execution id: \`${{ steps.exec.outputs.execution_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- runner: \`$(hostname)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Conteudo do workspace (so este repo esta em disco):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 | grep -v '^\.platform$' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar limites do repo
        run: |
          set -euo pipefail
          if [ -f .agentic/config.yml ]; then
            echo "Caminhos proibidos para o agente neste repo:"
            yq -r '.constraints.forbid_paths[]?' .agentic/config.yml || true
          fi

      - name: Ler o plano aprovado
        id: plano
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
        run: |
          set -euo pipefail
          PLANO=$(gh api "repos/$REPO/issues/$SUB_ISSUE/comments" \
            --jq '[.[] | select(.body | contains("<!-- pipe:plano-final -->"))] | last | .body // ""')

          if [ -z "$PLANO" ]; then
            echo "::warning::Nenhum plano marcado como final encontrado. Implementando sem plano explicito."
            PLANO="(nenhum plano de detalhamento foi encontrado para esta sub-issue)"
          fi

          {
            echo "plano<<PLANOEOF"
            echo "$PLANO"
            echo "PLANOEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Criar branch de trabalho
        env:
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
        run: |
          git config user.name  "agentic-${{ inputs.role }}"
          git config user.email "agentic@users.noreply.github.com"
          git checkout -b "agentic/$EXEC_ID"

      - name: Executar o papel (implementacao)
        id: agent
        uses: ./.platform/actions/run-agent
        with:
          role: ${{ inputs.role }}
          cli_override: ${{ inputs.cli_override }}
          model_override: ${{ inputs.model_override }}
          execution_id: ${{ steps.exec.outputs.execution_id }}
          prompt: "Implemente a sub-issue #${{ inputs.sub_issue }} deste repositorio, respeitando o contrato ${{ inputs.contract_ref }} e o plano ja aprovado abaixo. Nao reabra decisoes de decomposicao ja fechadas no plano - implemente o que ele descreve.\n\n${{ steps.plano.outputs.plano }}"
          platform_path: .platform

      - name: Materializar a alteracao
        env:
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          ROLE: ${{ inputs.role }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## $EXEC_ID"
            echo ""
            echo "- papel: \`$ROLE\`"
            echo "- cli: \`$CLI\`"
            echo "- modelo: \`$MODEL\`"
            echo "- sub-issue: #$SUB_ISSUE"
            echo "- contrato: \`$CONTRACT_REF\`"
            echo "- run: $RUN_URL"
            echo ""
          } >> CHANGELOG-agentic.md

          git add CHANGELOG-agentic.md
          git commit -m "feat: $ROLE para #$SUB_ISSUE (exec $EXEC_ID)"
          git push origin "agentic/$EXEC_ID"

      - name: Abrir pull request em draft (REST)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXEC_ID: ${{ steps.exec.outputs.execution_id }}
          ROLE: ${{ inputs.role }}
          CLI: ${{ steps.agent.outputs.cli }}
          MODEL: ${{ steps.agent.outputs.model }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          set -euo pipefail
          {
            echo "Gerado pela pipe agentica."
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| execution_id | \`$EXEC_ID\` |"
            echo "| papel | \`$ROLE\` |"
            echo "| cli | \`$CLI\` |"
            echo "| modelo | \`$MODEL\` |"
            echo "| contrato | \`$CONTRACT_REF\` |"
            echo ""
            echo "Closes #$SUB_ISSUE"
            echo ""
            echo "---"
            echo "**HITL 3** — este PR precisa de review humano. O App que abriu nao pode aprovar."
          } > pr_body.md

          jq -n \
            --arg title "[agentic] $ROLE — sub-issue #$SUB_ISSUE" \
            --rawfile body pr_body.md \
            --arg head "agentic/$EXEC_ID" \
            --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base, draft: true}' \
            > pr_payload.json

          gh api "repos/$REPO/pulls" --input pr_payload.json > pr.json
          echo "PR criado: $(jq -r .html_url pr.json)"

      - name: Reportar na sub-issue (REST)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUB_ISSUE: ${{ inputs.sub_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MSG="Implementacao concluida em \`$REPO\`. Run: $RUN_URL"
          jq -n --arg body "$MSG" '{body: $body}' > comment_payload.json
          gh api "repos/$REPO/issues/$SUB_ISSUE/comments" --input comment_payload.json
