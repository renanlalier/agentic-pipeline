name: run-agent
description: >
  Resolve CLI e modelo (nivel 3 -> 2 -> 1), valida contra a allowlist,
  localiza o contrato do papel (system sagrado + skills descobriveis) e
  os MCPs abstratos, e delega tudo ao adapter do CLI escolhido. A action
  NAO concatena skills nem instala MCP - cada adapter faz isso do jeito
  proprio do seu CLI.

inputs:
  role:
    description: "Papel logico a executar (po, lead-swe, frontend-swe, ...)"
    required: true
  cli_override:
    required: false
    default: ""
  model_override:
    required: false
    default: ""
  execution_id:
    required: true
  prompt:
    description: "A TAREFA. Vem da issue. Nunca e misturado ao system."
    required: true
  platform_path:
    required: false
    default: ".platform"

outputs:
  cli:
    value: ${{ steps.resolve.outputs.cli }}
  model:
    value: ${{ steps.resolve.outputs.model }}
  result:
    value: ${{ steps.dispatch.outputs.result }}

runs:
  using: composite
  steps:
    - name: Resolver configuracao (nivel 3 -> 2 -> 1)
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        PLAT="${{ inputs.platform_path }}"
        ROLE="${{ inputs.role }}"

        CLI_L2=$(yq -r ".defaults.cli // \"\"" .agentic/config.yml 2>/dev/null || echo "")
        MODEL_L2=$(yq -r ".defaults.models.\"$ROLE\" // \"\"" .agentic/config.yml 2>/dev/null || echo "")

        CLI="${{ inputs.cli_override }}"
        [ -z "$CLI" ] && CLI="$CLI_L2"
        [ -z "$CLI" ] && CLI="dry-run"

        MODEL="${{ inputs.model_override }}"
        [ -z "$MODEL" ] && MODEL="$MODEL_L2"
        [ -z "$MODEL" ] && MODEL="dry-run"

        APPROVED=$(yq -r ".clis.\"$CLI\".approved // false" "$PLAT/config/allowlist.yml")
        if [ "$APPROVED" != "true" ]; then
          echo "::error::CLI '$CLI' nao esta aprovado na allowlist (nivel 1)"
          exit 1
        fi

        ALLOWED=$(yq -r ".models.\"$ROLE\" | contains([\"$MODEL\"])" "$PLAT/config/allowlist.yml")
        if [ "$ALLOWED" != "true" ]; then
          echo "::error::Modelo '$MODEL' nao permitido para o papel '$ROLE'"
          exit 1
        fi

        echo "cli=$CLI"     >> "$GITHUB_OUTPUT"
        echo "model=$MODEL" >> "$GITHUB_OUTPUT"

        echo "### run-agent" >> "$GITHUB_STEP_SUMMARY"
        echo "| campo | valor |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
        echo "| papel | \`$ROLE\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| cli | \`$CLI\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| modelo | \`$MODEL\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| execution-id | \`${{ inputs.execution_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| repo | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"

    - name: Localizar o contrato do papel
      id: agent_dir
      shell: bash
      run: |
        set -euo pipefail
        PLAT="${{ inputs.platform_path }}"
        ROLE="${{ inputs.role }}"

        SYSTEM_FILE="$PLAT/agents/$ROLE/system.md"
        if [ ! -f "$SYSTEM_FILE" ]; then
          echo "::error::System prompt nao encontrado: $SYSTEM_FILE. Todo papel precisa de um."
          exit 1
        fi

        PLATFORM_SKILLS_DIR="$PLAT/agents/$ROLE/skills"
        REPO_SKILLS_DIR=".agentic/skills"

        echo "system_file=$SYSTEM_FILE" >> "$GITHUB_OUTPUT"
        echo "platform_skills_dir=$PLATFORM_SKILLS_DIR" >> "$GITHUB_OUTPUT"
        echo "repo_skills_dir=$REPO_SKILLS_DIR" >> "$GITHUB_OUTPUT"

        N_PLAT=$(find "$PLATFORM_SKILLS_DIR" -name SKILL.md 2>/dev/null | wc -l | tr -d ' ')
        N_REPO=$(find "$REPO_SKILLS_DIR" -name SKILL.md 2>/dev/null | wc -l | tr -d ' ')

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Contrato localizado:**" >> "$GITHUB_STEP_SUMMARY"
        echo "- system: \`$SYSTEM_FILE\` (sagrado, so platform)" >> "$GITHUB_STEP_SUMMARY"
        echo "- skills disponiveis: $N_PLAT da platform, $N_REPO do repo" >> "$GITHUB_STEP_SUMMARY"
        echo "- carregamento sob demanda: responsabilidade do adapter de cada CLI" >> "$GITHUB_STEP_SUMMARY"

    - name: Emitir headers de atribuicao
      shell: bash
      run: |
        echo "x-execution-id: ${{ inputs.execution_id }}"
        echo "x-run-id: ${{ github.run_id }}"
        echo "x-role: ${{ inputs.role }}"
        echo "x-cli: ${{ steps.resolve.outputs.cli }}"
        echo "x-model: ${{ steps.resolve.outputs.model }}"
        echo "x-repo: ${{ github.repository }}"

    - name: Despachar para o adapter
      id: dispatch
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        CLI: ${{ steps.resolve.outputs.cli }}
        MODEL: ${{ steps.resolve.outputs.model }}
        EXECUTION_ID: ${{ inputs.execution_id }}
        PROMPT: ${{ inputs.prompt }}
        SYSTEM_FILE: ${{ steps.agent_dir.outputs.system_file }}
        PLATFORM_SKILLS_DIR: ${{ steps.agent_dir.outputs.platform_skills_dir }}
        REPO_SKILLS_DIR: ${{ steps.agent_dir.outputs.repo_skills_dir }}
        MCP_CONFIG: ${{ inputs.platform_path }}/mcp/servers.yml
        CONTEXT7_API_KEY: ${{ env.CONTEXT7_API_KEY }}
      run: |
        set -euo pipefail
        PLAT="${{ inputs.platform_path }}"
        ADAPTER=$(yq -r ".clis.\"$CLI\".adapter" "$PLAT/config/allowlist.yml")

        chmod +x "$PLAT/$ADAPTER"
        RESULT=$("$PLAT/$ADAPTER")

        {
          echo "result<<AGENTEOF"
          echo "$RESULT"
          echo "AGENTEOF"
        } >> "$GITHUB_OUTPUT"
